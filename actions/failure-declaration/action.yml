name: Failure declaration validator
description: Validate the fail-closed failure-remediation declaration in a pull request body.
inputs:
  pr-body:
    description: Pull request body.
    required: true
  pr-author-type:
    description: GitHub author type.
    required: true
  pr-author-login:
    description: GitHub author login.
    required: true
runs:
  using: composite
  steps:
    - name: Validate failure-remediation declaration
      shell: bash
      env:
        INPUT_PR_BODY: ${{ inputs.pr-body }}
        INPUT_PR_AUTHOR_TYPE: ${{ inputs.pr-author-type }}
        INPUT_PR_AUTHOR_LOGIN: ${{ inputs.pr-author-login }}
      run: python3 "$GITHUB_ACTION_PATH/validate.py"
